<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blinder</title>
    <link rel="stylesheet" href="css/style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <h1>Bienvenue sur Blinder</h1>

    <form id="gameForm">
      <div id="idEntry">
        <input
          id="playlistIdEntry"
          type="text"
          placeholder="ID de la playlist"
          required
        />
        <button id="playButton" type="submit">Jouer</button>
      </div>

      <div>
        <p><strong>Indications :</strong></p>
        <ul>
          <li>
            L'ID se trouve dans le lien de la playlist :
            https://deezer.com/playlist/ID
          </li>
          <li>
            Votre profil peut être privé, mais la playlist doit obligatoirement
            être publique.
          </li>
        </ul>
      </div>
    </form>

    <script src="js/main.js"></script>
  </body>
</html>
